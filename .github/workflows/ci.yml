name: UAT build and safety checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/imdx?schema=public
      - name: Static security tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/imdx?schema=public
          OTP_HASH_SECRET: test-only-placeholder-secret-with-32-chars
          QR_ENCRYPTION_KEY: test-only-placeholder-encryption-32-chars
  e2e:
    # API-level E2E of PRD v1.4 flows against a disposable PostgreSQL 16.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 12
    env:
      PGPASSWORD: ci_only_password
      E2E_PG: -h localhost -p 5432 -U postgres
      E2E_DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/imdx_e2e
      E2E_FILES: tests/e2e/*.e2e.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install ffmpeg (gallery video compression, as in the Dockerfile)
        # The Ubuntu mirror sometimes hangs for 20+ minutes. Try apt with short timeouts, then fall back to the static
        # ffmpeg/ffprobe builds from npm, so a slow mirror can never cancel the whole E2E job.
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          if timeout 120 sudo apt-get install -y -qq --no-install-recommends $APT ffmpeg \
            || { timeout 120 sudo apt-get update -qq $APT && timeout 150 sudo apt-get install -y -qq --no-install-recommends $APT ffmpeg; }; then
            echo "ffmpeg from apt"
          else
            echo "::warning::apt mirror unavailable; using static ffmpeg from npm"
            mkdir -p "$RUNNER_TEMP/ff/bin" && cd "$RUNNER_TEMP/ff" && npm init -y >/dev/null
            timeout 240 npm install --no-audit --no-fund ffmpeg-static@5.2.0 ffprobe-static@3.1.0
            ln -sf "$(node -p "require('ffmpeg-static')")" bin/ffmpeg && ln -sf "$(node -p "require('ffprobe-static').path")" bin/ffprobe
            echo "$RUNNER_TEMP/ff/bin" >> "$GITHUB_PATH"; export PATH="$RUNNER_TEMP/ff/bin:$PATH"
          fi
          ffmpeg -version | head -1 && ffprobe -version | head -1
      - name: API E2E (business flow + CMS regression)
        run: bash scripts/e2e-local.sh
