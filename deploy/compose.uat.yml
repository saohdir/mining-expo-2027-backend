name: imdx-2027-uat
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: imdx_uat
      POSTGRES_USER: imdx
      POSTGRES_PASSWORD: ${IMDX_DB_PASSWORD:?Set IMDX_DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U imdx -d imdx_uat"]
      interval: 5s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
  app:
    build: {context: ..}
    restart: unless-stopped
    env_file: [../.env.uat]
    environment:
      DATABASE_URL: postgresql://imdx:${IMDX_DB_PASSWORD}@postgres:5432/imdx_uat?schema=public
      EMAIL_PROVIDER: smtp
      SMTP_FROM: "IMDX UAT <uat@localhost>"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      FLOORPLAN_UPLOAD_DIR: /var/lib/imdx/floorplans
      PRIVATE_FILE_DIR: /var/lib/imdx/private
      NODE_ENV: production
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [floorplan_data:/var/lib/imdx/floorplans, private_data:/var/lib/imdx/private]
  worker:
    build: {context: ..}
    command: ["npm","run","outbox:worker"]
    restart: unless-stopped
    env_file: [../.env.uat]
    environment:
      DATABASE_URL: postgresql://imdx:${IMDX_DB_PASSWORD}@postgres:5432/imdx_uat?schema=public
      EMAIL_PROVIDER: smtp
      SMTP_FROM: "IMDX UAT <uat@localhost>"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      NODE_ENV: production
    depends_on:
      postgres: {condition: service_healthy}
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on: [app]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../mining-expo-2027-demo:/usr/share/nginx/html:ro
volumes:
  postgres_data:
  floorplan_data:
  private_data:
