server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 16m;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 # Event gallery uploads: large videos, streamed straight to the app (no 16 MB limit, no buffering).
 location = /api/admin/gallery/upload {
  client_max_body_size 600m;
  proxy_request_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_pass http://app:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 # Content uploads (images ≤12 MB, PDFs ≤25 MB) need more than the default 16 MB (exact matches win over ^~ /api/).
 location = /api/admin/files {
  client_max_body_size 30m;
  proxy_read_timeout 120s;
  proxy_pass http://app:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location = /api/admin/assets {
  client_max_body_size 30m;
  proxy_read_timeout 120s;
  proxy_pass http://app:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location ^~ /api/ {
  proxy_pass http://app:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location ^~ /_next/ {
  proxy_pass http://app:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
 }
 location = /account { proxy_pass http://app:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
 location ^~ /account/ { proxy_pass http://app:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
 location = /conferences { proxy_pass http://app:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
 location ^~ /conferences/ { proxy_pass http://app:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
 location = /floorplan { proxy_pass http://app:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
 location = /admin { proxy_pass http://app:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
 location ^~ /admin/ { proxy_pass http://app:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
 # CR-PROGRAMME: /programme/<slug>/ (and /zh/programme/<slug>/ after the /zh rewrite below) serve one static detail shell.
 # A subrequest asks the app whether the page is published (204) or not (403 -> real 404 page); /programme/ itself stays static.
 location ~ "^/programme/[a-z0-9]+(-[a-z0-9]+)*/?$" {
  auth_request /_programme_exists;
  error_page 403 =404 /404.html;
  try_files /programme/item.html =404;
 }
 location = /_programme_exists {
  internal;
  proxy_pass http://app:3000/api/public/programme-exists;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $host;
  proxy_set_header X-Original-URI $request_uri;
 }
 # CR-LANG-01: /zh/... serves the same static page; assets/platform.js switches the language to Simplified Chinese.
 location = /zh { return 301 /zh/; }
 location ^~ /zh/ { rewrite ^/zh/(.*)$ /$1 last; }
 # NFR-03: browser caching for static assets (images/fonts rarely change; CSS/JS short because some URLs are unversioned).
 location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2?)$ { expires 7d; add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
 location ~* \.(?:css|js)$ { expires 1h; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
 location / { try_files $uri $uri/ =404; }
}
